<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatBox - Drum Kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="title">BeatBox</h1>
            <p class="subtitle">Press the keys or click the buttons to play drums</p>
        </header>

        <div id="drums" class="drums-grid">
            <button id="w" class="btn" data-key="w" data-sound="sounds/haha.mp3">
                <span class="key">W</span>
            </button>
            <button id="a" class="btn" data-key="a" data-sound="sounds/tom-4.mp3">
                <span class="key">A</span>
            </button>
            <button id="s" class="btn" data-key="s" data-sound="sounds/kick-bass.mp3">
                <span class="key">S</span>
            </button>
            <button id="d" class="btn" data-key="d" data-sound="sounds/snare.mp3">
                <span class="key">D</span>
            </button>
            <button id="j" class="btn" data-key="j" data-sound="sounds/tom-1.mp3">
                <span class="key">J</span>
            </button>
            <button id="k" class="btn" data-key="k" data-sound="sounds/tom-2.mp3">
                <span class="key">K</span>
            </button>
            <button id="l" class="btn" data-key="l" data-sound="sounds/tom-3.mp3">
                <span class="key">L</span>
            </button>
        </div>

        <div class="controls">
            <button id="mute-btn" class="control-btn" aria-label="Mute">
                <span class="volume-icon">🔊</span>
            </button>
            <div class="volume-control">
                <label for="volume-slider">Volume:</label>
                <input id="volume-slider" type="range" min="0" max="100" value="70">
                <span id="volume-display">70%</span>
            </div>
        </div>

        <footer class="footer">
            <p>Keyboard shortcuts: W, A, S, D, J, K, L</p>
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
